<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdrawal Details</title>

    <!-- Firebase Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Active Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAtsqtuixJrKPutV87ZcY33TWY4pTqD_Es",
            authDomain: "my-sip-f413e.firebaseapp.com",
            projectId: "my-sip-f413e",
            storageBucket: "my-sip-f413e.firebasestorage.app",
            messagingSenderId: "922732328257",
            appId: "1:922732328257:web:9b277c3e4edc52f6919dc0",
            measurementId: "G-X7MCR83TDC"
        };

        // Firebase Init
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Fetch Withdrawals Function
        function fetchWithdrawals(targetUid, userPhone) {
            const listDiv = document.getElementById('withdrawalList');
            const withdrawalsRef = collection(db, "withdrawals");

            // Direct Realtime listener on withdrawals collection
            onSnapshot(withdrawalsRef, (snapshot) => {
                if (snapshot.empty) {
                    listDiv.innerHTML = "<p style='text-align:center; color:#777; margin:20px 0;'>कोई विथड्रॉल रिकॉर्ड नहीं है।</p>";
                    return;
                }

                let userDocs = [];
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    // Match either userId, uid or phone number
                    const matchesUser = (targetUid && (data.userId === targetUid || data.uid === targetUid)) ||
                                        (userPhone && data.phone === userPhone);

                    if (matchesUser) {
                        userDocs.push({ id: docSnap.id, ...data });
                    }
                });

                if (userDocs.length === 0) {
                    listDiv.innerHTML = "<p style='text-align:center; color:#777; margin:20px 0;'>कोई विथड्रॉल रिकॉर्ड नहीं है।</p>";
                    return;
                }

                // Client-side Sorting (Newest First)
                userDocs.sort((a, b) => {
                    const timeA = a.createdAt?.seconds ? (a.createdAt.seconds * 1000) : new Date(a.dateStr || a.date || a.createdAt || 0).getTime();
                    const timeB = b.createdAt?.seconds ? (b.createdAt.seconds * 1000) : new Date(b.dateStr || b.date || b.createdAt || 0).getTime();
                    return timeB - timeA;
                });

                let html = '';
                userDocs.forEach((item) => {
                    let statusClass = 'badge-pending';
                    let statusText = item.status || 'Pending';
                    const sLower = String(statusText).toLowerCase();

                    if (sLower === 'approved' || sLower === 'success') {
                        statusClass = 'badge-approved';
                        statusText = 'Approved';
                    } else if (sLower === 'rejected' || sLower === 'failed') {
                        statusClass = 'badge-rejected';
                        statusText = 'Rejected';
                    } else {
                        statusText = 'Pending';
                    }

                    const accNum = item.accountNumber || item.account || '';
                    const accDisplay = accNum ? '...' + String(accNum).slice(-4) : 'N/A';

                    html += `
                        <div class="withdrawal-item">
                            <div class="item-left">
                                <div class="amount">₹${parseFloat(item.amount || 0).toFixed(2)}</div>
                                <div class="bank-details">
                                    Account: ${accDisplay}<br>
                                    IFSC: ${item.ifsc || item.ifscCode || 'N/A'}
                                </div>
                                <div class="date">${item.dateStr || item.date || 'N/A'}</div>
                            </div>
                            <div class="item-right">
                                <span class="badge ${statusClass}">${statusText}</span>
                            </div>
                        </div>
                    `;
                });

                listDiv.innerHTML = html;

            }, (error) => {
                console.error("Withdrawal details fetch error:", error);
                listDiv.innerHTML = "<p style='text-align:center; color:red; margin:20px 0;'>डेटा लोड करने में समस्या आई।</p>";
            });
        }

        // Auth Listener with LocalStorage Fallback
        onAuthStateChanged(auth, (user) => {
            const savedUser = JSON.parse(localStorage.getItem("loggedInUser")) || {};
            const savedPhone = localStorage.getItem("userPhone") || savedUser.phone;

            if (user) {
                fetchWithdrawals(user.uid, savedPhone);
            } else if (savedUser.uid || savedPhone) {
                fetchWithdrawals(savedUser.uid, savedPhone);
            } else {
                window.location.href = "login.html";
            }
        });
    </script>

    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f7f6;
            padding: 20px 15px;
            color: #333;
            margin: 0;
        }

        .container {
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: auto;
        }

        h1 {
            color: #004a99;
            text-align: center;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .withdrawal-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .withdrawal-item:last-child {
            border-bottom: none;
        }

        .item-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .amount {
            font-size: 18px;
            font-weight: bold;
            color: #dc3545;
        }

        .bank-details {
            font-size: 12px;
            color: #555;
            line-height: 1.4;
        }

        .date {
            font-size: 11px;
            color: #999;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            text-transform: capitalize;
        }

        .badge-pending {
            background-color: #ff9800;
        }

        .badge-approved {
            background-color: #28a745;
        }

        .badge-rejected {
            background-color: #dc3545;
        }

        .back-btn {
            display: block;
            margin-top: 25px;
            padding: 12px;
            background: #004a99;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Withdrawal History</h1>

    <div id="withdrawalList">
        <p style="text-align:center; color:#777;">लोड हो रहा है...</p>
    </div>

    <a href="my_profile1.html" class="back-btn">
        वापस जाएं
    </a>

</div>

</body>
</html>
