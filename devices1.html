<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Devices</title>

    <!-- Firebase Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Aapka Active Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAtsqtuixJrKPutV87ZcY33TWY4pTqD_Es",
            authDomain: "my-sip-f413e.firebaseapp.com",
            projectId: "my-sip-f413e",
            storageBucket: "my-sip-f413e.firebasestorage.app",
            messagingSenderId: "922732328257",
            appId: "1:922732328257:web:9b277c3e4edc52f6919dc0",
            measurementId: "G-X7MCR83TDC"
        };

        // Firebase Init
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Check Login & Realtime Devices Sync
        onAuthStateChanged(auth, (user) => {
            if (user) {
                const userDocRef = doc(db, "users", user.uid);

                // Firestore Document Sync Listener
                onSnapshot(userDocRef, (docSnap) => {
                    const deviceListContainer = document.getElementById('deviceList');

                    if (docSnap.exists()) {
                        const userData = docSnap.data();
                        const devices = userData.devices || [];

                        if (devices.length === 0) {
                            deviceListContainer.innerHTML = "<p style='text-align:center; margin-top:20px; color:#666;'>कोई डिवाइस नहीं है।</p>";
                            return;
                        }

                        // Devices Render Karein
                        let HTMLContent = '';
                        devices.forEach((device) => {
                            const formattedDate = device.purchaseDate 
                                ? new Date(device.purchaseDate).toLocaleDateString() 
                                : 'N/A';

                            HTMLContent += `
                                <div class="device-card">
                                    <div class="img-box">
                                        <img src="${device.image || 'https://i.ibb.co/Xfr8c2tb/1.png'}" alt="${device.name}">
                                    </div>
                                    <div class="title">${device.name}</div>
                                    <div class="details-grid">
                                        <div class="detail-box">
                                            Daily Profit
                                            <b>₹${device.dailyProfit || 0}</b>
                                        </div>
                                        <div class="detail-box">
                                            Purchased On
                                            <b>${formattedDate}</b>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });

                        deviceListContainer.innerHTML = HTMLContent;

                    } else {
                        deviceListContainer.innerHTML = "<p style='text-align:center; margin-top:20px; color:#666;'>यूजर डाटा उपलब्ध नहीं है।</p>";
                    }
                }, (error) => {
                    console.error("Devices fetch error:", error);
                    document.getElementById('deviceList').innerHTML = "<p style='text-align:center; margin-top:20px; color:red;'>डाटा लोड करने में त्रुटि हुई!</p>";
                });

            } else {
                // User logged in nahi hai toh Login page par redirect karein
                window.location.href = "login.html";
            }
        });
    </script>

    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding-bottom: 20px;
        }

        .header {
            background: #1a3a6a;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }

        .device-card {
            background: white;
            margin: 15px;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #1a3a6a;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .img-box {
            width: 100%;
            height: 150px;
            background: #eee;
            border-radius: 8px;
            overflow: hidden;
        }

        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .title {
            font-weight: bold;
            font-size: 18px;
            color: #1a3a6a;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .detail-box {
            background: #f8f9fa;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-size: 12px;
            border: 1px solid #eee;
        }

        .detail-box b {
            color: #007bff;
            display: block;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="header">
        My Devices
    </div>

    <div id="deviceList">
        <p style="text-align:center; margin-top:20px;">लोड हो रहा है...</p>
    </div>

</body>
</html>
