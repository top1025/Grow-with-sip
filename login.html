
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mining App</title>

    <!-- Firebase Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Aapka Active Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAtsqtuixJrKPutV87ZcY33TWY4pTqD_Es",
            authDomain: "my-sip-f413e.firebaseapp.com",
            projectId: "my-sip-f413e",
            storageBucket: "my-sip-f413e.firebasestorage.app",
            messagingSenderId: "922732328257",
            appId: "1:922732328257:web:9b277c3e4edc52f6919dc0",
            measurementId: "G-X7MCR83TDC"
        };

        // Firebase Init
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Firebase Login Function
        window.verifyLogin = async function() {
            const phone = document.getElementById('loginPhone').value.trim();
            const pass = document.getElementById('loginPass').value;
            const btn = document.getElementById('loginBtn');

            if (!phone || !pass) {
                alert("कृपया सभी जानकारी भरें!");
                return;
            }

            btn.innerText = "Checking...";
            btn.disabled = true;

            // Phone number se formatted email (Matching Register.html format)
            const cleanPhone = phone.replace(/\D/g, ''); // Sirf numbers retain karein
            const email = `${cleanPhone}@bivimanminer.com`;

            try {
                // Firebase Auth Sign In
                await signInWithEmailAndPassword(auth, email, pass);
                
                alert("✅ Login Successful!");
                window.location.href = "index1.html";

            } catch (error) {
                console.error("Login Error:", error);

                if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                    alert("❌ फ़ोन नंबर या पासवर्ड गलत है, या यूजर मौजूद नहीं है!");
                } else if (error.code === 'auth/wrong-password') {
                    alert("❌ गलत पासवर्ड!");
                } else {
                    alert("❌ लॉगिन विफल रहा! कृपया विवरण जांचें।");
                }
            } finally {
                btn.innerText = "Login Now";
                btn.disabled = false;
            }
        };
    </script>

    <style>
        body { margin: 0; font-family: sans-serif; background: linear-gradient(135deg, #0a192f, #112240); display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 25px; width: 85%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .tabs { display: flex; justify-content: space-around; margin-bottom: 30px; font-weight: bold; cursor: pointer; }
        .active { border-bottom: 3px solid #27ae60; color: #27ae60; padding-bottom: 5px; }
        input { width: 100%; padding: 15px; margin: 10px 0; border: none; background: #f4f4f4; border-radius: 12px; box-sizing: border-box; }
        .reg-btn { width: 100%; padding: 15px; border: none; border-radius: 25px; background: linear-gradient(to right, #27ae60, #2ecc71); color: white; font-weight: bold; margin-top: 20px; cursor: pointer; font-size: 16px; }
        .reg-btn:disabled { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="card">
    <div class="tabs">
        <span class="active">Login</span>
        <span onclick="window.location.href='register.html'">Register</span>
    </div>
    
    <input type="tel" id="loginPhone" placeholder="Enter phone number" maxlength="10">
    <input type="password" id="loginPass" placeholder="Enter password">
    
    <button class="reg-btn" id="loginBtn" onclick="verifyLogin()">Login Now</button>
</div>

</body>
</html>
