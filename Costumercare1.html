
<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Care | Grow with SIP</title>

    <!-- Firebase Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Active Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAtsqtuixJrKPutV87ZcY33TWY4pTqD_Es",
            authDomain: "my-sip-f413e.firebaseapp.com",
            projectId: "my-sip-f413e",
            storageBucket: "my-sip-f413e.firebasestorage.app",
            messagingSenderId: "922732328257",
            appId: "1:922732328257:web:9b277c3e4edc52f6919dc0",
            measurementId: "G-X7MCR83TDC"
        };

        // Firebase Init
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        // Check Login Status & Auto-fill User Phone
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                if (user.phoneNumber) {
                    document.getElementById('phone').value = user.phoneNumber;
                }
            } else {
                // Not Logged In Redirect
                window.location.href = "login.html";
            }
        });

        // Form Submit Event Listener
        document.addEventListener("DOMContentLoaded", () => {
            const complaintForm = document.getElementById("complaintForm");

            complaintForm.addEventListener("submit", async function(event) {
                event.preventDefault();

                const btn = document.getElementById("submitBtn");
                const successMsg = document.getElementById("successMessage");

                const name = document.getElementById("name").value.trim();
                const phone = document.getElementById("phone").value.trim();
                const message = document.getElementById("message").value.trim();

                if (!name || !phone || !message) {
                    alert("❌ कृपया सभी जानकारी भरें!");
                    return;
                }

                btn.disabled = true;
                btn.innerText = "Sending...";

                try {
                    // Save Support Ticket to Firestore 'support_tickets' collection
                    await addDoc(collection(db, "support_tickets"), {
                        userId: currentUser ? currentUser.uid : "Anonymous",
                        name: name,
                        phone: phone,
                        message: message,
                        createdAt: serverTimestamp(),
                        dateStr: new Date().toLocaleString('en-IN'),
                        status: "Pending"
                    });

                    // UI Feedback
                    successMsg.style.display = "block";
                    complaintForm.reset();
                    btn.disabled = false;
                    btn.innerText = "Submit Shikayat";

                    setTimeout(() => {
                        successMsg.style.display = "none";
                    }, 5000);

                } catch (error) {
                    console.error("Support submission error:", error);
                    alert("❌ Shikayat submit karne me error aaya. Kripya firse koshish karein.");
                    btn.disabled = false;
                    btn.innerText = "Submit Shikayat";
                }
            });
        });
    </script>

    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            color: #28a745;
            text-align: center;
        }

        p {
            text-align: center;
            color: #555;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            background: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .success {
            display: none;
            background: #e8f5e9;
            color: #218838;
            padding: 12px;
            margin-top: 15px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Customer Care</h2>

    <p>
        Apni shikayat yahan submit karein:
    </p>

    <form id="complaintForm">

        <input
            type="text"
            id="name"
            placeholder="Aapka Naam"
            required
        >

        <input
            type="tel"
            id="phone"
            placeholder="Aapka Mobile Number"
            required
        >

        <textarea
            id="message"
            rows="4"
            placeholder="Apni shikayat likhein..."
            required
        ></textarea>

        <button
            type="submit"
            id="submitBtn"
        >
            Submit Shikayat
        </button>

    </form>

    <div
        class="success"
        id="successMessage"
    >
        ✅ Shikayat successfully submit ho gayi!
    </div>

</div>

</body>
</html>
